name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GOFLAGS: -mod=readonly
  GOPROXY: https://proxy.golang.org
  GOSUMDB: sum.golang.org
  GOVCS: '*:off'
  GOTOOLCHAIN: local
  OLS_WPANEL_REQUIRE_PHP_TESTS: '1'

jobs:
  verify:
    name: Test, vet, and build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: true

      - name: Check installer syntax
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          bash -n install-cn.sh
          sed \
            -e 's/^BOOTSTRAP_RELEASE_VERSION=.*/BOOTSTRAP_RELEASE_VERSION="v0.0.0"/' \
            -e 's/^BOOTSTRAP_DEFAULT_PREFER_CN=.*/BOOTSTRAP_DEFAULT_PREFER_CN=0/' \
            install-cn.sh > "$RUNNER_TEMP/bootstrap.sh"
          bash -n "$RUNNER_TEMP/bootstrap.sh"

      - name: Validate installer on the native Ubuntu architecture
        shell: bash
        run: |
          sudo bash install.sh --check-platform
          sudo bash "$RUNNER_TEMP/bootstrap.sh" --check-platform

      - name: Validate installer on Debian 13 amd64
        if: matrix.arch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" debian:13 bash /src/install.sh --check-platform
          docker run --rm -i debian:13 bash -s -- --check-platform < "$RUNNER_TEMP/bootstrap.sh"

      - name: Validate installer on Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 bash /src/install.sh --check-platform
          docker run --rm -i ubuntu:26.04 bash -s -- --check-platform < "$RUNNER_TEMP/bootstrap.sh"

      - name: Verify OpenLiteSpeed, LSPHP, and Redis packages on Ubuntu 24.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 bash /src/install.sh --check-ols-packages

      - name: Verify OpenLiteSpeed, LSPHP, and Redis packages on Ubuntu 26.04
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 bash /src/install.sh --check-ols-packages

      - name: Verify OpenLiteSpeed, LSPHP, and Redis packages on Debian 13
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" debian:13 bash /src/install.sh --check-ols-packages

      - name: Verify default MariaDB repository
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/install.sh --check-mariadb-packages
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 \
            bash /src/install.sh --check-mariadb-packages
          docker run --rm -v "$PWD:/src:ro" debian:13 \
            bash /src/install.sh --check-mariadb-packages

      - name: Download and verify Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Verify frontend behavior
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          frontend_tests=(tests/js/*.cjs)
          test "${#frontend_tests[@]}" -gt 0
          for test_file in "${frontend_tests[@]}"; do
            node "$test_file"
          done

      - name: Verify terminal maintenance behavior
        shell: bash
        run: |
          set -euo pipefail
          bash -n internal/executor/panel_cli.sh
          python3 internal/executor/panel_cli_render_test.py
          python3 internal/executor/panel_cli_behavior_test.py

      - name: Require PHP regression runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends php-cli
          fi
          php -n -r 'exit(PHP_VERSION_ID >= 80000 && function_exists("json_encode") ? 0 : 1);'

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          packages_file="$RUNNER_TEMP/ci-packages"
          test_log="$RUNNER_TEMP/go-test.log"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          if ! go test -trimpath "${packages[@]}" >"$test_log" 2>&1; then
            cat "$test_log"
            detail=$(tail -n 100 "$test_log" | tail -c 6000)
            detail=${detail//'%'/'%25'}
            detail=${detail//$'\r'/'%0D'}
            detail=${detail//$'\n'/'%0A'}
            echo "::error title=Go test failure::$detail"
            exit 1
          fi
          cat "$test_log"

      - name: Vet
        shell: bash
        run: |
          set -euo pipefail
          packages_file="$RUNNER_TEMP/ci-packages"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          go vet "${packages[@]}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=0 go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/ols-wpanel-${{ matrix.arch }}" ./cmd/ols-wpanel
