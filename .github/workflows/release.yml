name: Release

on:
  push:
    tags:
      - 'v*'
  # Recovery is explicit and still crosses the protected signing environment.
  # It is used when an immutable tag exists but publication never completed.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Canonical release tag; created at the exact main commit when missing
        required: true
        type: string
      release_commit:
        description: Full 40-character current main commit to release
        required: true
        type: string

# Deny write access by default. Individual jobs opt in only when required.
permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  RELEASE_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_commit || github.sha }}
  OLS_WPANEL_REQUIRE_PHP_TESTS: '1'

concurrency:
  # Serialize tag pushes and manual recovery runs for the same logical release.
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Require every downloaded module to match go.sum and disallow VCS fallback.
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GONOSUMDB: ''
      GOPRIVATE: ''
      GOINSECURE: ''
      GOVCS: '*:off'
      GOTOOLCHAIN: local
      RELEASE_PUBLIC_KEY_HEX: e6b66d84c67c8247821d2ab16b6d8e9584a962d4c8458d1f06b52d9cbbd65bd6
    steps:
      - name: Check out the tagged commit
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          # The release gate below also requires the authoritative main ref.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned Go toolchain
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: false

      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          case "$GITHUB_EVENT_NAME" in
            push)
              test "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")" = "$RELEASE_COMMIT"
              test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
              test "$(git rev-parse refs/remotes/origin/main)" = "$RELEASE_COMMIT"
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = 'refs/heads/main'
              test "$(git rev-parse refs/remotes/origin/main)" = "$GITHUB_SHA"
              test "$RELEASE_COMMIT" = "$GITHUB_SHA"
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          bash -n install.sh install-cn.sh
          sudo bash install.sh --check-platform

          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/install.sh --check-mariadb-packages
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 \
            bash /src/install.sh --check-mariadb-packages
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 \
            bash /src/install.sh --check-ols-packages
          docker run --rm -v "$PWD:/src:ro" debian:13 \
            bash /src/install.sh --check-mariadb-packages

          # These vendored browser assets are part of the reviewed Git commit.
          # Release builds must never replace them with live CDN downloads.
          test -s web/css/main.css
          test -s web/js/alpine.min.js
          test -s web/js/chart.min.js
          test -s web/js/app.js
          test -s LICENSE
          test -s third_party/NOTICE.md
          test -s third_party/THIRD_PARTY_NOTICES.md
          test -s third_party/adminer-6.0.1/LICENSE-APACHE-2.0.txt
          test -s third_party/adminer-6.0.1/NOTICE.txt
          grep -Fq '* @copyright 2007 Jakub Vrana' internal/executor/assets/adminer-6.0.1-mysql.php
          grep -Fq '* @version 6.0.1' internal/executor/assets/adminer-6.0.1-mysql.php
          git diff --exit-code -- web
          grep -Fq "ReleasePublicKeyHex = \"$RELEASE_PUBLIC_KEY_HEX\"" internal/config/distribution.go

      - name: Download and verify Go modules
        shell: bash
        run: |
          set -euo pipefail
          go mod download
          go mod verify

      - name: Verify frontend behavior
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          frontend_tests=(tests/js/*.cjs)
          test "${#frontend_tests[@]}" -gt 0
          for test_file in "${frontend_tests[@]}"; do
            node "$test_file"
          done

      - name: Verify terminal maintenance behavior
        shell: bash
        run: |
          set -euo pipefail
          bash -n internal/executor/panel_cli.sh
          python3 internal/executor/panel_cli_render_test.py
          python3 internal/executor/panel_cli_behavior_test.py

      - name: Require PHP regression runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends php-cli
          fi
          php -n -r 'exit(PHP_VERSION_ID >= 80000 && function_exists("json_encode") ? 0 : 1);'

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          packages_file="$RUNNER_TEMP/release-packages"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          go test -trimpath "${packages[@]}"

      - name: Static check
        shell: bash
        run: |
          set -euo pipefail
          packages_file="$RUNNER_TEMP/release-packages"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          go vet "${packages[@]}"

      - name: Build release inputs with normalized metadata
        shell: bash
        run: |
          set -euo pipefail
          worktree_status="$(git status --porcelain --untracked-files=all)"
          if [[ -n "$worktree_status" ]]; then
            echo "Tests or tools modified the release source tree:" >&2
            printf '%s\n' "$worktree_status" >&2
            exit 1
          fi
          mkdir -p dist

          version="$RELEASE_TAG"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          build_time="$(date --utc --date="@$source_date_epoch" '+%Y-%m-%dT%H:%M:%SZ')"

          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build \
              -trimpath \
              -buildvcs=true \
              -ldflags="-s -w -buildid= -X main.Version=$version -X main.BuildTime=$build_time" \
              -o "dist/ols-wpanel-linux-$arch" \
              ./cmd/ols-wpanel
            test -s "dist/ols-wpanel-linux-$arch"
            test "$(od -An -tx1 -N4 "dist/ols-wpanel-linux-$arch" | tr -d ' \n')" = '7f454c46'
          done

          preflight_dir="$RUNNER_TEMP/ols-wpanel-release-preflight"
          install -d -m 0700 "$preflight_dir"
          cat > "$preflight_dir/config.json" <<EOF
          {
            "panel": {
              "port": 8888,
              "tls_port": 8443,
              "random_suffix": "release-preflight",
              "data_dir": "$preflight_dir",
              "backup_dir": "$preflight_dir",
              "log_dir": "$preflight_dir"
            },
            "sqlite": {"path": "$preflight_dir/preflight.db"},
            "mariadb": {"root_password": "release-preflight-only"},
            "admin": {"username": "preflight", "password_hash": "preflight"},
            "paths": {"cron_file": "/etc/cron.d/ols_wpanel_cron"},
            "systemd": {
              "service_name": "ols-wpanel",
              "service_path": "/etc/systemd/system/ols-wpanel.service",
              "binary_path": "/usr/local/bin/ols-wpanel"
            }
          }
          EOF
          chmod 0600 "$preflight_dir/config.json"
          ./dist/ols-wpanel-linux-amd64 --info --config "$preflight_dir/config.json" > "$preflight_dir/info.txt"
          grep -Fq 'OLS WPanel' "$preflight_dir/info.txt"
          grep -Fq "版本: $version " "$preflight_dir/info.txt"

          # Publish the reviewed installers as downloadable assets. They are copied,
          # hashed, and later signed as data; no downstream job executes them.
          sed \
            "s/^INSTALLER_RELEASE_VERSION=.*/INSTALLER_RELEASE_VERSION=\"$version\"/" \
            install.sh > dist/install.sh
          sed \
            "s/^BOOTSTRAP_RELEASE_VERSION=.*/BOOTSTRAP_RELEASE_VERSION=\"$version\"/" \
            install-cn.sh > dist/install-cn.sh
          sed \
            -e "s/^BOOTSTRAP_RELEASE_VERSION=.*/BOOTSTRAP_RELEASE_VERSION=\"$version\"/" \
            -e 's/^BOOTSTRAP_DEFAULT_PREFER_CN=.*/BOOTSTRAP_DEFAULT_PREFER_CN=0/' \
            install-cn.sh > dist/bootstrap.sh
          chmod 0755 dist/install.sh dist/install-cn.sh dist/bootstrap.sh
          test "$(head -n 1 dist/install.sh)" = '#!/bin/bash'
          test "$(head -n 1 dist/install-cn.sh)" = '#!/bin/bash'
          test "$(head -n 1 dist/bootstrap.sh)" = '#!/bin/bash'
          grep -Fxq "INSTALLER_RELEASE_VERSION=\"$version\"" dist/install.sh
          grep -Fxq "BOOTSTRAP_RELEASE_VERSION=\"$version\"" dist/install-cn.sh
          grep -Fxq "BOOTSTRAP_RELEASE_VERSION=\"$version\"" dist/bootstrap.sh
          grep -Fxq 'BOOTSTRAP_DEFAULT_PREFER_CN=1' dist/install-cn.sh
          grep -Fxq 'BOOTSTRAP_DEFAULT_PREFER_CN=0' dist/bootstrap.sh
          sudo bash dist/bootstrap.sh --check-platform
          docker run --rm -i ubuntu:26.04 bash -s -- --check-platform < dist/bootstrap.sh
          docker run --rm -i debian:13 bash -s -- --check-platform < dist/bootstrap.sh

          # Collect the reviewed browser notices plus the exact license files
          # from every external Go module linked into the release binary.
          license_root="$RUNNER_TEMP/ols-wpanel-third-party-licenses"
          module_list="$RUNNER_TEMP/ols-wpanel-release-modules"
          install -d -m 0755 "$license_root"
          install -m 0644 LICENSE "$license_root/LICENSE"
          install -m 0644 third_party/NOTICE.md "$license_root/NOTICE.md"
          install -m 0644 third_party/THIRD_PARTY_NOTICES.md "$license_root/THIRD_PARTY_NOTICES.md"
          printf '%s\n' "$version" > "$license_root/RELEASE_VERSION"

          # The released binary is statically linked with this exact Go toolchain.
          # Standard-library packages have no .Module metadata, so preserve the
          # toolchain license explicitly instead of silently dropping it.
          go_root="$(realpath -e -- "$(go env GOROOT)")"
          go_version="$(go env GOVERSION)"
          required_go_version="$(awk '$1 == "toolchain" { print $2; exit }' go.mod)"
          test -n "$required_go_version"
          test "$required_go_version" = 'go1.26.8'
          test "$go_version" = "$required_go_version"
          test -f "$go_root/LICENSE"
          test ! -L "$go_root/LICENSE"
          install -d -m 0755 "$license_root/go-toolchain"
          printf '%s\n' "$go_version" > "$license_root/go-toolchain/VERSION"
          install -m 0644 "$go_root/LICENSE" "$license_root/go-toolchain/LICENSE"
          if [[ -e "$go_root/PATENTS" ]] || [[ -L "$go_root/PATENTS" ]]; then
            test -f "$go_root/PATENTS"
            test ! -L "$go_root/PATENTS"
            install -m 0644 "$go_root/PATENTS" "$license_root/go-toolchain/PATENTS"
          fi

          # Adminer is embedded as PHP source in the Go binary. It is distributed
          # under its Apache-2.0 option, with the exact version/copyright notice.
          install -d -m 0755 "$license_root/adminer-6.0.1"
          install -m 0644 third_party/adminer-6.0.1/LICENSE-APACHE-2.0.txt \
            "$license_root/adminer-6.0.1/LICENSE-APACHE-2.0.txt"
          install -m 0644 third_party/adminer-6.0.1/NOTICE.txt \
            "$license_root/adminer-6.0.1/NOTICE.txt"

          CGO_ENABLED=0 go list -deps -f '{{with .Module}}{{.Path}}|{{.Version}}|{{.Dir}}{{end}}' ./cmd/ols-wpanel \
            | LC_ALL=C sort -u > "$module_list"
          main_module="$(go list -m -f '{{.Path}}')"
          gomodcache_real="$(realpath -e -- "$(go env GOMODCACHE)")"
          module_index=0
          while IFS='|' read -r module_path module_version module_dir; do
            [[ -n "$module_path" ]] || continue
            [[ "$module_path" != "$main_module" ]] || continue
            [[ -n "$module_version" ]] || {
              echo "External module has no pinned version: $module_path" >&2
              exit 1
            }
            module_dir_real="$(realpath -e -- "$module_dir")"
            case "$module_dir_real" in
              "$gomodcache_real"/*) ;;
              *)
                echo "Module directory escaped GOMODCACHE: $module_path" >&2
                exit 1
                ;;
            esac

            module_index=$((module_index + 1))
            module_output="$license_root/$(printf '%03d' "$module_index")"
            install -d -m 0755 "$module_output"
            printf '%s\n%s\n' "$module_path" "$module_version" > "$module_output/MODULE"
            license_count=0
            license_file_list="$RUNNER_TEMP/ols-wpanel-license-files-$(printf '%03d' "$module_index")"
            find "$module_dir_real" -mindepth 1 -maxdepth 1 -type f \
              \( -iname 'LICENSE' -o -iname 'LICENSE.*' \
                 -o -iname 'LICENCE' -o -iname 'LICENCE.*' \
                 -o -iname 'COPYING' -o -iname 'COPYING.*' \
                 -o -iname 'NOTICE' -o -iname 'NOTICE.*' \) \
              -print0 | LC_ALL=C sort -z > "$license_file_list"
            while IFS= read -r -d '' license_file; do
              license_name="$(basename -- "$license_file")"
              [[ "$license_name" =~ ^[A-Za-z0-9._-]+$ ]] || {
                echo "Unsafe license filename for $module_path: $license_name" >&2
                exit 1
              }
              install -m 0644 "$license_file" "$module_output/$license_name"
              license_count=$((license_count + 1))
            done < "$license_file_list"
            rm -f -- "$license_file_list"
            if [[ "$license_count" -eq 0 ]]; then
              echo "No top-level license or notice found for $module_path@$module_version" >&2
              exit 1
            fi
          done < "$module_list"
          test "$module_index" -gt 0

          tar --sort=name \
            --format=posix \
            --pax-option=delete=atime,delete=ctime \
            --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner \
            -cf - -C "$license_root" . \
            | gzip -n -9 > dist/ols-wpanel-third-party-licenses.tar.gz
          test -s dist/ols-wpanel-third-party-licenses.tar.gz

          cd dist
          for asset in \
            ols-wpanel-linux-amd64 \
            ols-wpanel-linux-arm64 \
            install.sh \
            install-cn.sh \
            bootstrap.sh \
            ols-wpanel-third-party-licenses.tar.gz; do
            sha256sum "$asset" > "$asset.unsigned.sha256"
            sha256sum --check --strict "$asset.unsigned.sha256"
          done

      - name: Upload unsigned release input
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-release-${{ env.RELEASE_COMMIT }}
          path: |
            dist/ols-wpanel-linux-amd64
            dist/ols-wpanel-linux-amd64.unsigned.sha256
            dist/ols-wpanel-linux-arm64
            dist/ols-wpanel-linux-arm64.unsigned.sha256
            dist/install.sh
            dist/install.sh.unsigned.sha256
            dist/install-cn.sh
            dist/install-cn.sh.unsigned.sha256
            dist/bootstrap.sh
            dist/bootstrap.sh.unsigned.sha256
            dist/ols-wpanel-third-party-licenses.tar.gz
            dist/ols-wpanel-third-party-licenses.tar.gz.unsigned.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  native-arm64:
    name: Native ARM64 release verification
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOVCS: '*:off'
      GOTOOLCHAIN: local
    steps:
      - name: Check out reviewed source
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        # actions/setup-go v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          check-latest: false
          cache: true

      - name: Require PHP regression runtime
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends php-cli
          fi
          php -n -r 'exit(PHP_VERSION_ID >= 80000 && function_exists("json_encode") ? 0 : 1);'

      - name: Test and execute natively on ARM64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo bash install.sh --check-platform
          docker run --rm -v "$PWD:/src:ro" ubuntu:24.04 \
            bash /src/install.sh --check-mariadb-packages
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 \
            bash /src/install.sh --check-mariadb-packages
          docker run --rm -v "$PWD:/src:ro" ubuntu:26.04 \
            bash /src/install.sh --check-ols-packages
          docker run --rm -v "$PWD:/src:ro" debian:13 \
            bash /src/install.sh --check-mariadb-packages
          go mod download
          go mod verify
          packages_file="$RUNNER_TEMP/release-arm64-packages"
          go list ./... | grep -v '/scratch$' > "$packages_file"
          mapfile -t packages < "$packages_file"
          test "${#packages[@]}" -gt 0
          go test -trimpath "${packages[@]}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -buildvcs=true -o "$RUNNER_TEMP/ols-wpanel-arm64" ./cmd/ols-wpanel
          test -x "$RUNNER_TEMP/ols-wpanel-arm64"
          preflight_dir="$RUNNER_TEMP/ols-wpanel-arm64-preflight"
          install -d -m 0700 "$preflight_dir"
          cat > "$preflight_dir/config.json" <<EOF
          {
            "panel": {"port": 8888, "tls_port": 8443, "random_suffix": "arm64-preflight", "data_dir": "$preflight_dir", "backup_dir": "$preflight_dir", "log_dir": "$preflight_dir"},
            "sqlite": {"path": "$preflight_dir/preflight.db"},
            "mariadb": {"root_password": "arm64-preflight-only"},
            "admin": {"username": "preflight", "password_hash": "preflight"},
            "paths": {"cron_file": "/etc/cron.d/ols_wpanel_cron"},
            "systemd": {"service_name": "ols-wpanel", "service_path": "/etc/systemd/system/ols-wpanel.service", "binary_path": "/usr/local/bin/ols-wpanel"}
          }
          EOF
          "$RUNNER_TEMP/ols-wpanel-arm64" --info --config "$preflight_dir/config.json" > "$preflight_dir/info.txt"
          grep -Fq 'OLS WPanel' "$preflight_dir/info.txt"

  sign:
    name: Sign release assets
    needs: [build, native-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: release-signing
    # Artifact transport uses the runner's scoped artifact token, not GITHUB_TOKEN.
    permissions: {}
    env:
      RELEASE_PUBLIC_KEY_HEX: e6b66d84c67c8247821d2ab16b6d8e9584a962d4c8458d1f06b52d9cbbd65bd6
      RELEASE_PUBLIC_KEY_SPKI_B64: MCowBQYDK2VwAyEA5rZthMZ8gkeCHSqxa22OlYSpYtTIRY0fBrUtnLvWW9Y=
    steps:
      # Do not check out or execute repository code in this job.
      - name: Download unsigned release input
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: unsigned-release-${{ env.RELEASE_COMMIT }}
          path: release-assets

      - name: Validate unsigned release input
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 12
          for asset in \
            ols-wpanel-linux-amd64 \
            ols-wpanel-linux-arm64 \
            install.sh \
            install-cn.sh \
            bootstrap.sh \
            ols-wpanel-third-party-licenses.tar.gz; do
            test -f "$asset"
            test ! -L "$asset"
            test -f "$asset.unsigned.sha256"
            test ! -L "$asset.unsigned.sha256"
            test "$(cat "$asset.unsigned.sha256")" = "$(sha256sum "$asset")"
            sha256sum --check --strict "$asset.unsigned.sha256"
            mv "$asset.unsigned.sha256" "$asset.sha256"
          done

      - name: Sign checksums and self-check against pinned key
        shell: bash
        working-directory: release-assets
        env:
          RELEASE_SIGNING_KEY_B64: ${{ secrets.RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077

          key_file="$RUNNER_TEMP/release-signing-key.pem"
          public_file="$RUNNER_TEMP/release-signing-public.pem"
          cleanup() {
            rm -f "$key_file" "$public_file"
          }
          trap cleanup EXIT

          test -n "$RELEASE_SIGNING_KEY_B64"
          printf '%s' "$RELEASE_SIGNING_KEY_B64" | base64 --decode > "$key_file"
          openssl pkey -in "$key_file" -check -noout
          openssl pkey -in "$key_file" -pubout -out "$public_file"

          actual_public_key_hex="$(
            openssl pkey -pubin -in "$public_file" -outform DER |
              tail -c 32 |
              od -An -tx1 |
              tr -d ' \n'
          )"
          if [[ "$actual_public_key_hex" != "$RELEASE_PUBLIC_KEY_HEX" ]]; then
            echo "Release signing key does not match the embedded public key" >&2
            exit 1
          fi
          actual_public_key_spki_b64="$(
            openssl pkey -pubin -in "$public_file" -outform DER |
              base64 |
              tr -d '\n'
          )"
          if [[ "$actual_public_key_spki_b64" != "$RELEASE_PUBLIC_KEY_SPKI_B64" ]]; then
            echo "Release signing key has an unexpected SPKI encoding" >&2
            exit 1
          fi

          for checksum in \
            ols-wpanel-linux-amd64.sha256 \
            ols-wpanel-linux-arm64.sha256 \
            install.sh.sha256 \
            install-cn.sh.sha256 \
            bootstrap.sh.sha256 \
            ols-wpanel-third-party-licenses.tar.gz.sha256; do
            openssl pkeyutl -sign -rawin \
              -inkey "$key_file" \
              -in "$checksum" \
              -out "$checksum.sig"
            test "$(wc -c < "$checksum.sig")" -eq 64
            openssl pkeyutl -verify -rawin -pubin \
              -inkey "$public_file" \
              -in "$checksum" \
              -sigfile "$checksum.sig"
          done

      - name: Upload signed release assets
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signed-release-${{ env.RELEASE_COMMIT }}
          path: |
            release-assets/ols-wpanel-linux-amd64
            release-assets/ols-wpanel-linux-amd64.sha256
            release-assets/ols-wpanel-linux-amd64.sha256.sig
            release-assets/ols-wpanel-linux-arm64
            release-assets/ols-wpanel-linux-arm64.sha256
            release-assets/ols-wpanel-linux-arm64.sha256.sig
            release-assets/install.sh
            release-assets/install.sh.sha256
            release-assets/install.sh.sha256.sig
            release-assets/install-cn.sh
            release-assets/install-cn.sh.sha256
            release-assets/install-cn.sh.sha256.sig
            release-assets/bootstrap.sh
            release-assets/bootstrap.sh.sha256
            release-assets/bootstrap.sh.sha256.sig
            release-assets/ols-wpanel-third-party-licenses.tar.gz
            release-assets/ols-wpanel-third-party-licenses.tar.gz.sha256
            release-assets/ols-wpanel-third-party-licenses.tar.gz.sha256.sig
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

  release:
    name: Verify and publish release
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_PUBLIC_KEY_SPKI_B64: MCowBQYDK2VwAyEA5rZthMZ8gkeCHSqxa22OlYSpYtTIRY0fBrUtnLvWW9Y=
    steps:
      # Do not check out or execute repository code in this job.
      - name: Download signed release assets
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: signed-release-${{ env.RELEASE_COMMIT }}
          path: release-assets

      - name: Verify release assets
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          test "$(find . -mindepth 1 -maxdepth 1 | wc -l)" -eq 18

          public_pem="$RUNNER_TEMP/release-signing-public.pem"
          cleanup() {
            rm -f "$public_pem"
          }
          trap cleanup EXIT

          printf '%s\n' \
            '-----BEGIN PUBLIC KEY-----' \
            "$RELEASE_PUBLIC_KEY_SPKI_B64" \
            '-----END PUBLIC KEY-----' > "$public_pem"
          openssl pkey -pubin -in "$public_pem" -noout
          for asset in \
            ols-wpanel-linux-amd64 \
            ols-wpanel-linux-arm64 \
            install.sh \
            install-cn.sh \
            bootstrap.sh \
            ols-wpanel-third-party-licenses.tar.gz; do
            test -f "$asset"
            test ! -L "$asset"
            test -f "$asset.sha256"
            test ! -L "$asset.sha256"
            test -f "$asset.sha256.sig"
            test ! -L "$asset.sha256.sig"
            test "$(wc -c < "$asset.sha256.sig")" -eq 64
            test "$(cat "$asset.sha256")" = "$(sha256sum "$asset")"
            sha256sum --check --strict "$asset.sha256"
            openssl pkeyutl -verify -rawin -pubin \
              -inkey "$public_pem" \
              -in "$asset.sha256" \
              -sigfile "$asset.sha256.sig"
          done

      - name: Create or update GitHub Release
        shell: bash
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=(
            ols-wpanel-linux-amd64 ols-wpanel-linux-amd64.sha256 ols-wpanel-linux-amd64.sha256.sig
            ols-wpanel-linux-arm64 ols-wpanel-linux-arm64.sha256 ols-wpanel-linux-arm64.sha256.sig
            install.sh install.sh.sha256 install.sh.sha256.sig
            install-cn.sh install-cn.sh.sha256 install-cn.sh.sha256.sig
            bootstrap.sh bootstrap.sh.sha256 bootstrap.sh.sha256.sig
            ols-wpanel-third-party-licenses.tar.gz
            ols-wpanel-third-party-licenses.tar.gz.sha256
            ols-wpanel-third-party-licenses.tar.gz.sha256.sig
          )

          # Manual recovery may create a missing tag, but only here: this is
          # the sole contents:write job and it never checks out repository
          # code. Re-read main immediately before the write so the tag cannot
          # be attached to an older reviewed commit after main has advanced.
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            main_commit="$(gh api "/repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$main_commit" != "$RELEASE_COMMIT" ]] || [[ "$GITHUB_SHA" != "$RELEASE_COMMIT" ]]; then
              echo "Manual releases must target the exact current main commit" >&2
              echo "input=$RELEASE_COMMIT event=$GITHUB_SHA main=$main_commit" >&2
              exit 1
            fi
            if gh api "/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Validating existing tag $RELEASE_TAG"
            else
              gh api --method POST "/repos/$GH_REPO/git/refs" \
                -f "ref=refs/tags/$RELEASE_TAG" \
                -f "sha=$RELEASE_COMMIT" >/dev/null
              echo "Created tag $RELEASE_TAG at $RELEASE_COMMIT"
            fi
          fi

          # Re-resolve the remote tag immediately before publication. The build
          # job checked main earlier, but a mutable tag could otherwise be moved
          # while the protected signing job is awaiting approval. Repository
          # rules must also make v* tags immutable to close the final API race.
          tag_object="$(
            gh api "/repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" \
              --jq '.object.type + " " + .object.sha'
          )"
          resolved_tag_commit=""
          for _ in 1 2 3 4 5 6 7 8; do
            read -r object_type object_sha extra_field <<< "$tag_object"
            test -z "${extra_field:-}"
            [[ "$object_sha" =~ ^[0-9a-f]{40}$ ]]
            case "$object_type" in
              commit)
                resolved_tag_commit="$object_sha"
                break
                ;;
              tag)
                tag_object="$(
                  gh api "/repos/$GH_REPO/git/tags/$object_sha" \
                    --jq '.object.type + " " + .object.sha'
                )"
                ;;
              *)
                echo "Release tag resolved to unsupported object type: $object_type" >&2
                exit 1
                ;;
            esac
          done
          if [[ "$resolved_tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Release tag no longer resolves to the reviewed commit" >&2
            echo "expected=$RELEASE_COMMIT actual=${resolved_tag_commit:-unresolved}" >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace published assets" >&2
            exit 1
          fi
          release_notes="See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_COMMIT/CHANGELOG.md) and [the verified upgrade guide](https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_COMMIT/docs/verified-install.md)."
          if [[ "$RELEASE_TAG" == 'v1.0.0' ]]; then
            release_notes="Initial OLS WPanel release with OpenLiteSpeed, per-site LSPHP, automatic LiteSpeed Cache and Redis configuration, and signed amd64/arm64 installation for Debian 13 and Ubuntu 24.04 LTS. Quick install: https://ols.zangyubin.top/install. $release_notes"
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes "$release_notes"
