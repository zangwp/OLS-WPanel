{{define "firewall_controller"}}
<script>
function firewallManager(initialTab = 'current') {
    return {
        activeTab: 'current',
        bans: [],
        banAnomalies: [],
        currentBanReadStatus: null,
        history: [],
        historyLoaded: false,
        historyLoading: false,
        historySearchIP: '',
        historyPage: 1,
        historyTotalPages: 1,
        historyTotal: 0,
		historyExpanded: false,
		historyHasMore: false,
        banIP: '',
        banDuration: '600',
        banSubmitting: false,
        showRules: false,
        securityReportItems: [],
        securityReportLoaded: false,
        securityReportLoading: false,
        typeFilter: '',
        fileSecurityEvents: [],
        fileSecurityLoaded: false,
        fileSecurityLoading: false,
        fileSecuritySummary: null,
        searchIP: '',
        banLevelFilter: '',
        banSourceFilter: '',
        page: 1,
        totalPages: 1,
        total: 0,
        portStatus: { backend: '', writable: false, warning: '', input_policy: '', ssh_port: 22, panel_port: 0, current_management_ip: '', managed_rule_count: 0, anomaly_count: 0, listener_count: 0, network_listener_count: 0, local_listener_count: 0, dangerous_listener_count: 0, listeners: [], rules: [] },
        portForm: { protocol: 'tcp', port: null, source: '', source_mode: 'current', description: '', duration_mode: 'permanent', duration_minutes: 60, confirm_public: false },
        selectedPortPreset: '',
        portPresets: [
            { key: 'ssh', label: 'SSH', protocol: 'tcp', portKey: 'ssh_port', fallback: 22, sourceMode: 'current', description: 'SSH' },
            { key: 'http', label: 'HTTP', protocol: 'tcp', fallback: 80, sourceMode: 'any', description: 'HTTP' },
            { key: 'https', label: 'HTTPS', protocol: 'tcp', fallback: 443, sourceMode: 'any', description: 'HTTPS' },
            { key: 'http3', label: 'HTTP/3', protocol: 'udp', fallback: 443, sourceMode: 'any', description: 'HTTP/3 QUIC' },
            { key: 'panel', label: 'OLS WPanel', protocol: 'tcp', portKey: 'panel_port', sourceMode: 'current', description: 'OLS WPanel' },
        ],
        portsLoaded: false,
        portsLoading: false,
        portSubmitting: false,
        protectionSubmitting: false,
        accessRows: [],
        accessPreview: null,
        accessBusy: false,
        accessToken: '',
        accessTimer: null,
        accessDeadline: '',
        accessChecked: false,
        accessDirty: false,
        accessError: '',
        markAccessDirty() { this.accessDirty = true; this.accessPreview = null; this.accessError = ''; },
        async refreshAccess() {
            if (this.accessToken || this.accessBusy) return;
            if (this.accessDirty && !await confirmModal(t('firewall.access_discard'))) return;
            await this.fetchPortStatus();
        },
        accessCustomPort: '',
        accessCustomProtocol: 'tcp',
        addAccessRow() {
            const port = Number(this.accessCustomPort), protocol = this.accessCustomProtocol, key = protocol + ':' + port;
            if (!Number.isInteger(port) || port < 1 || port > 65535) { this.accessError = t('firewall.access_invalid_port'); return; }
            if (this.accessRows.some(r => r.key === key)) { this.accessError = t('firewall.access_duplicate_port'); return; }
            this.accessRows.push({ key, protocol, port, label: '', scope: this.accessSensitive({port}) ? 'closed' : 'public', sources: '', listening: false });
            this.accessCustomPort = ''; this.markAccessDirty();
        },
        resetAccessRows() {
            const s = this.portStatus, rows = new Map();
            const panelPort = Number(s.panel_port);
            const panelPortKnown = Number.isInteger(panelPort) && panelPort > 0 && panelPort <= 65535;
            const add = (protocol, port, label = '') => {
                const key = protocol + ':' + port;
                if (!rows.has(key)) rows.set(key, { key, protocol, port, label, scope: 'closed', sources: '', listening: false });
                return rows.get(key);
            };
            add('tcp', s.ssh_port || 22, 'SSH');
            if (panelPortKnown) add('tcp', panelPort, 'OLS WPanel');
            add('tcp', 80, 'HTTP'); add('tcp', 443, 'HTTPS'); add('udp', 443, 'HTTP/3');
            add('tcp', 3306, 'MariaDB'); add('tcp', 6379, 'Redis'); add('tcp', 7080, 'OpenLiteSpeed WebAdmin');
            for (const l of s.listeners || []) {
                const label = this.serviceDisplayName(l.process) === 'OLS WPanel' && (!panelPortKnown || Number(l.port) !== panelPort) ? '' : l.process || '';
                const r = add(l.protocol, Number(l.port), label);
                r.process = l.process || '';
                if (l.bind_scope !== 'local') r.listening = true;
            }
            for (const r of s.rules || []) {
                const label = this.serviceDisplayName(r.description) === 'OLS WPanel' && (!panelPortKnown || Number(r.port) !== panelPort) ? '' : r.description || '';
                add(r.protocol, Number(r.port), label);
            }
            if (s.access_enabled) {
                for (const rule of s.access_rules || []) {
                    const r = add(rule.protocol, Number(rule.port));
                    if (!rule.source) r.scope = 'public';
                    else { if (r.scope !== 'public') r.scope = 'specific'; r.sources += (r.sources ? ', ' : '') + rule.source; }
                }
            } else {
                for (const port of [s.ssh_port || 22, ...(panelPortKnown ? [panelPort] : [])]) Object.assign(add('tcp', port), { scope: 'public', sources: s.current_management_ip || '' });
                add('tcp', 80).scope = 'public'; add('tcp', 443).scope = 'public';
            }
            this.accessRows = [...rows.values()]; this.accessPreview = null; this.accessDirty = false; this.accessError = '';
        },
        accessSensitive(row) { return [7080, 3306, 6379].includes(Number(row.port)); },
        accessPayload() {
            return this.accessRows.flatMap(r => r.scope === 'closed' ? [] : r.scope === 'public' ? [{ protocol: r.protocol, port: Number(r.port), source: '' }] : String(r.sources).split(/[,\s]+/).filter(Boolean).map(source => ({ protocol: r.protocol, port: Number(r.port), source })));
        },
        async previewAccess() {
            if (this.accessRows.some(r => r.scope === 'specific' && !String(r.sources).trim())) { this.accessError = t('firewall.source_required'); showToast(this.accessError, 'error'); return; }
            if (this.accessBusy || this.accessToken) return;
            this.accessBusy = true; this.accessPreview = null; this.accessError = '';
            try { const r = await api('/firewall/ports/access/preview', { method: 'POST', body: { rules: this.accessPayload() } }); if (!r.success) throw Error(r.message || t('common.operation_failed')); this.accessPreview = r.data; }
            catch(e) { this.accessError = e.message; showToast(e.message, 'error'); } finally { this.accessBusy = false; }
        },
        async applyAccess() {
            if (this.accessBusy || this.accessToken || !this.accessPreview || !await confirmModal(t('firewall.access_apply_confirm'))) return;
            this.accessBusy = true;
            try {
                const r = await api('/firewall/ports/access/apply', { method: 'POST', body: { rules: this.accessPreview.rules, fingerprint: this.accessPreview.fingerprint }, timeout: 30000 });
                if (!r.success || !r.data?.confirmation_token) throw Error(t('common.operation_failed'));
                clearTimeout(this.accessTimer);
                this.accessTimer = setTimeout(() => { this.accessToken = ''; this.accessChecked = false; this.fetchPortStatus(); }, 95000);
                this.accessToken = r.data.confirmation_token; this.accessDeadline = r.data.deadline; this.accessChecked = false; this.accessPreview = null;
                await this.fetchPortStatus();
            } catch(e) { this.accessError = e.message; showToast(e.message, 'error'); this.accessPreview = null; } finally { this.accessBusy = false; }
        },
        async confirmAccess() {
            if (this.accessBusy || !this.accessChecked || !this.accessToken) return;
            this.accessBusy = true;
            try {
                const r = await api('/firewall/ports/access/confirm', { method: 'POST', body: { token: this.accessToken }, timeout: 20000 });
                if (!r.success) throw Error(t('common.operation_failed'));
                clearTimeout(this.accessTimer); this.accessToken = ''; this.accessChecked = false; await this.fetchPortStatus(); showToast(t('firewall.access_saved'), 'success');
            } catch(e) { this.accessError = e.message; showToast(e.message, 'error'); } finally { this.accessBusy = false; }
        },
        init() {
            if (initialTab === 'ports') { this.loadTab('ports'); return; }
            const requestedTab = new URLSearchParams(window.location.search).get('tab');
            if (requestedTab === 'ports') { window.location.replace(window.location.pathname.replace(/\/firewall$/, '/security') + '#ports'); return; }
            if (['current', 'wp', 'files', 'history', 'ports'].includes(requestedTab)) {
                this.loadTab(requestedTab);
                return;
            }
            this.fetchBans();
        },
        loadTab(tab) {
            this.activeTab = tab;
            if (tab === 'wp' && !this.securityReportLoaded && !this.securityReportLoading) {
                this.fetchWPSecurityReport();
            }
            if (tab === 'files' && !this.fileSecurityLoaded && !this.fileSecurityLoading) {
                this.loadFileSecurityEvents();
            }
            if (tab === 'history' && !this.historyLoaded && !this.historyLoading) {
                this.fetchHistory();
            }
            if (tab === 'ports' && !this.portsLoaded && !this.portsLoading) {
                this.fetchPortStatus();
            }
        },
        async fetchPortStatus() {
            this.portsLoading = true;
            try {
                const r = await api('/firewall/ports', { silent: true });
                if (r.success) {
                    this.portStatus = r.data || this.portStatus;
                    this.resetAccessRows();
                    if (this.portForm.source_mode === 'current') this.portForm.source = this.portStatus.current_management_ip || '';
                    this.portsLoaded = true;
                }
            } catch(e) { showToast(e.message || t('common.operation_failed'), 'error'); }
            finally { this.portsLoading = false; }
        },
        async addPortRule() {
            if (!this.portForm.port) return;
            if (this.portForm.source_mode !== 'any' && !String(this.portForm.source || '').trim()) {
                showToast(t('firewall.source_required'), 'error');
                return;
            }
            if (this.portForm.duration_mode === 'temporary' && Number(this.portForm.duration_minutes || 0) < 1) {
                showToast(t('firewall.duration_required'), 'error');
                return;
            }
            if (this.portForm.source_mode === 'any' && !(await confirmModal(t('firewall.confirm_any_source')))) return;
            const scope = this.portForm.source_mode === 'any' ? t('firewall.any_source') : this.portForm.source;
            if (!(await confirmModal(t('firewall.confirm_open_port', { protocol: this.portForm.protocol.toUpperCase(), port: this.portForm.port, source: scope })))) return;
            this.portSubmitting = true;
            try {
                const body = { ...this.portForm, confirm_public: this.portForm.source_mode === 'any' };
                if (body.duration_mode === 'permanent') body.duration_minutes = 0;
                await api('/firewall/ports', { method: 'POST', body });
                this.resetPortForm();
                await this.fetchPortStatus();
                showToast(t('firewall.port_opened'), 'success');
            } catch(e) { showToast(e.message || t('common.operation_failed'), 'error'); }
            finally { this.portSubmitting = false; }
        },
        resetPortForm() {
            this.selectedPortPreset = '';
            this.portForm = { protocol: 'tcp', port: null, source: this.portStatus.current_management_ip || '', source_mode: 'current', description: '', duration_mode: 'permanent', duration_minutes: 60, confirm_public: false };
        },
        applyPortPreset(preset) {
            const port = preset.portKey ? Number(this.portStatus[preset.portKey] || preset.fallback) : preset.fallback;
            if (!Number.isInteger(port) || port < 1 || port > 65535) { showToast(t('firewall.panel_port_unknown'), 'error'); return; }
            this.selectedPortPreset = preset.key;
            this.portForm.protocol = preset.protocol;
            this.portForm.port = port;
            this.portForm.description = preset.description;
            this.portForm.source_mode = preset.sourceMode;
            this.onSourceModeChange();
        },
        selectedPresetLabel() {
            const preset = this.portPresets.find(item => item.key === this.selectedPortPreset);
            return preset ? preset.label : t('firewall.custom_service');
        },
        onSourceModeChange() {
            if (this.portForm.source_mode === 'current') this.portForm.source = this.portStatus.current_management_ip || '';
            if (this.portForm.source_mode === 'any') this.portForm.source = '';
            if (this.portForm.source_mode === 'specific' && this.portForm.source === this.portStatus.current_management_ip) this.portForm.source = '';
        },
        async enableProtection() { await this.previewAccess(); },
        firewallBackendLabel() {
            const backend = this.portStatus.backend || '';
            return { nftables: 'Nftables', ufw: 'UFW', iptables: 'Iptables' }[backend.toLowerCase()] || backend || '--';
        },
        firewallPolicyLabel() {
            if (this.portStatus.access_enabled) return t('firewall.access_policy_restricted');
            const policy = (this.portStatus.input_policy || '').toLowerCase();
            return { drop: t('firewall.policy_drop'), accept: t('firewall.policy_accept') }[policy] || this.portStatus.input_policy || '--';
        },
        serviceDisplayName(value) {
            const raw = String(value || '').trim();
            return { http: 'HTTP', https: 'HTTPS', 'http/3': 'HTTP/3', ssh: 'SSH', sshd: 'SSH', dns: 'DNS', ntp: 'NTP', redis: 'Redis', 'redis-server': 'Redis', mariadb: 'MariaDB', mariadbd: 'MariaDB', mysqld: 'MariaDB', openlitespeed: 'OpenLiteSpeed', litespeed: 'OpenLiteSpeed', lshttpd: 'OpenLiteSpeed', wordpress: 'WordPress', lsphp: 'LSPHP', 'ols wpanel': 'OLS WPanel', 'ols-wpanel': 'OLS WPanel', 'ols webadmin': 'OpenLiteSpeed WebAdmin', 'openlitespeed webadmin': 'OpenLiteSpeed WebAdmin' }[raw.toLowerCase()] || raw;
        },
        formatFirewallTime(value) {
            if (!value) return '--';
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? '--' : date.toLocaleString(currentLocale());
        },
        isSensitiveNetworkListener(listener) {
            return listener?.bind_scope !== 'local' && [3306, 6379].includes(Number(listener?.port || 0));
        },
        listenerExposureLabel(listener) {
            if (listener?.host_exposure === 'local_only') return t('firewall.exposure_local_only');
            if (listener?.host_exposure === 'allowed_by_default') return t('firewall.exposure_allowed_by_default');
            return t('firewall.exposure_rule_dependent');
        },
        async deletePortRule(rule) {
            if (!(await confirmModal(t('firewall.confirm_close_port', { protocol: String(rule.protocol || '').toUpperCase(), port: rule.port })))) return;
            try {
                await api('/firewall/ports/' + encodeURIComponent(rule.id), { method: 'DELETE' });
                await this.fetchPortStatus();
                showToast(t('firewall.port_closed'), 'success');
            } catch(e) { showToast(e.message || t('common.operation_failed'), 'error'); }
        },
        async fetchBans() {
            try {
                let url = '/firewall/bans?page=' + this.page;
                if (this.searchIP.trim()) url += '&search=' + encodeURIComponent(this.searchIP.trim());
                if (this.banLevelFilter) url += '&level=' + encodeURIComponent(this.banLevelFilter);
                if (this.banSourceFilter) url += '&source=' + encodeURIComponent(this.banSourceFilter);
                const r = await api(url);
                if (r.success) {
                    this.bans = r.data?.data || r.data || [];
                    this.banAnomalies = r.data?.anomalies || [];
                    this.currentBanReadStatus = r.data?.read_status || null;
                    this.total = r.data?.total || this.bans.length;
                    this.page = r.data?.page || 1;
                    this.totalPages = r.data?.total_pages || 1;
                }
            } catch(e) {}
        },
        resetBanFilters() {
            this.searchIP = '';
            this.banLevelFilter = '';
            this.banSourceFilter = '';
            this.page = 1;
            this.fetchBans();
        },
        hasCurrentBanReadWarning() {
            const status = this.currentBanReadStatus;
            if (!status) return false;
            const fail2ban = status.fail2ban || {};
            return !status.nftables || ['olswpanel', 'olswpanel-404', 'olswpanel-login', 'olswpanel-sshd', 'olswpanel-sqli'].some(jail => !fail2ban[jail]);
        },
        async fetchHistory() {
            this.historyLoading = true;
            try {
                let url = '/firewall/bans?history=1&page=' + this.historyPage;
				if (this.historyExpanded) url += '&expanded=1';
                if (this.historySearchIP.trim()) url += '&search=' + encodeURIComponent(this.historySearchIP.trim());
                const r = await api(url, { silent: true });
                if (r.success) {
                    this.history = r.data?.data || r.data || [];
                    this.historyTotal = r.data?.total || this.history.length;
                    this.historyPage = r.data?.page || 1;
                    this.historyTotalPages = r.data?.total_pages || 1;
					this.historyHasMore = !!r.data?.has_more;
                    this.historyLoaded = true;
                }
            } catch(e) {}
            finally { this.historyLoading = false; }
        },
        resetHistorySearch() {
            this.historySearchIP = '';
            this.historyPage = 1;
            this.fetchHistory();
        },
        historyGoPage(p) {
            if (p < 1 || p > this.historyTotalPages) return;
            this.historyPage = p;
            this.fetchHistory();
        },
		expandHistory() {
			this.historyExpanded = true;
			this.historyPage = 1;
			this.fetchHistory();
		},
        get historyPageNumbers() {
            const pages = [];
            const total = this.historyTotalPages;
            const current = this.historyPage;
            let start = Math.max(1, current - 2);
            let end = Math.min(total, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            for (let i = start; i <= end; i++) pages.push(i);
            return pages;
        },
        async fetchWPSecurityReport() {
            this.securityReportLoading = true;
            try {
                const r = await api('/firewall/wp-security-report');
                if (r.success) {
                    this.securityReportItems = r.data?.items || [];
                    this.securityReportLoaded = true;
                }
            } catch(e) { showToast(t('firewall.load_wp_report_failed', { error: e.message }), 'error'); }
            finally { this.securityReportLoading = false; }
        },
        async loadFileSecurityEvents() {
            try {
                const r = await api('/firewall/file-security-events', { silent: true });
                if (r.success) {
                    this.fileSecurityEvents = r.data?.events || [];
                    this.fileSecuritySummary = r.data?.summary || null;
                    this.fileSecurityLoaded = true;
                }
            } catch(e) {
                this.fileSecurityLoaded = true;
            }
        },
        async refreshFileSecurityEvents(clearFirst = false) {
            if (clearFirst && !(await confirmModal(t('firewall.confirm_clear_history')))) return;
            this.fileSecurityLoading = true;
            try {
                const url = '/firewall/file-security-events/refresh' + (clearFirst ? '?clear=1' : '');
                const r = await api(url, { method: 'POST' });
                if (r.success) {
                    this.fileSecurityEvents = r.data?.events || [];
                    this.fileSecuritySummary = r.data?.summary || null;
                    this.fileSecurityLoaded = true;
                }
            } catch(e) { showToast(t('firewall.refresh_file_security_failed', { error: e.message }), 'error'); }
            finally { this.fileSecurityLoading = false; }
        },
        goPage(p) {
            if (p < 1 || p > this.totalPages) return;
            this.page = p;
            this.fetchBans();
        },
        get pageNumbers() {
            const pages = [];
            const total = this.totalPages;
            const current = this.page;
            let start = Math.max(1, current - 2);
            let end = Math.min(total, start + 4);
            if (end - start < 4) start = Math.max(1, end - 4);
            for (let i = start; i <= end; i++) pages.push(i);
            return pages;
        },
        banLevelText(l) { return [t('firewall.ban_level_empty'), t('firewall.ban_level_rate_limit'), t('firewall.ban_level_10m'), t('firewall.ban_level_24h'), t('firewall.ban_level_30d'), t('firewall.ban_level_permanent')][l] || t('firewall.unknown'); },
        banLevelClass(l) { return ['','badge-info','badge-warning','badge-danger','badge-danger','badge-danger'][l] || 'badge-info'; },
        riskClass(level) {
            if (level === '高' || level === 'high') return 'badge-danger';
            if (level === '中' || level === 'medium') return 'badge-warning';
            return 'badge-info';
        },
        riskLabel(level) {
            if (level === 'high') return t('firewall.risk_high');
            if (level === 'medium') return t('firewall.risk_medium');
            if (level === 'low') return t('firewall.risk_low');
            return level || t('firewall.risk_low');
        },
        filteredSecurityReportItems() {
            if (!this.typeFilter) return this.securityReportItems;
            return this.securityReportItems.filter(item => (item.types || []).includes(this.typeFilter));
        },
        securityEventTypeLabel(type) {
            if (type === 'sensitive_file_scan') return t('firewall.type_sensitive_file_scan');
            if (type === 'sqli_probe') return t('firewall.type_sqli_probe');
            if (type === 'sqli_blocked') return t('firewall.type_sqli_blocked');
            if (type === 'wp_login_failed') return t('firewall.type_wp_login_failed');
            if (type === 'xmlrpc_blocked') return t('firewall.type_xmlrpc_blocked');
            if (type === 'fake_search_bot') return t('firewall.type_fake_search_bot');
            if (type === 'suspicious_php') return t('firewall.type_suspicious_php');
            return type;
        },
        securityEventTypeClass(type) {
            if (type === 'sqli_blocked') return 'badge-danger';
            if (type === 'sqli_probe') return 'badge-warning';
            if (type === 'fake_search_bot' || type === 'sensitive_file_scan') return 'badge-warning';
            return 'badge-info';
        },
        fileEventTypeLabel(event) {
            if (event.event_type === 'runtime_php_access') return t('firewall.event_runtime_php_access');
            if (event.event_type === 'suspicious_runtime_php_file') return t('firewall.event_suspicious_php_file');
            if (event.event_type === 'code_integrity_added') return t('firewall.event_integrity_added');
            if (event.event_type === 'code_integrity_modified') return t('firewall.event_integrity_modified');
            if (event.event_type === 'code_integrity_deleted') return t('firewall.event_integrity_deleted');
            if (event.event_type === 'code_integrity_link_changed') return t('firewall.event_integrity_link');
            if (event.event_type === 'code_integrity_unavailable') return t('firewall.event_integrity_unavailable');
            return event.event_type || '--';
        },
        fileEventSourceLabel(event) {
            if (event.source === 'scanner') return t('firewall.source_scanner');
            if (event.source === 'integrity') return t('firewall.source_integrity');
            return event.source || '--';
        },
        fileEventCountLabel(event) {
            if (event.event_type === 'suspicious_runtime_php_file' || event.source === 'integrity') return t('firewall.found');
            return event.event_count || 0;
        },
        sourceLabel(ban) {
            if (ban.source_jail === 'olswpanel') return t('firewall.source_web_protect');
            if (ban.source_jail === 'olswpanel-login') return t('firewall.source_login');
            if (ban.source_jail === 'olswpanel-sqli') return t('firewall.source_sqli');
            if (ban.source_jail === 'olswpanel-404') return t('firewall.source_404');
            if (ban.source_jail === 'olswpanel-sshd') return t('firewall.source_ssh');
            if (ban.source_jail === 'panel') return t('firewall.source_panel');
            if (ban.source_jail === 'panel_scan') return t('firewall.source_scan');
            if (ban.source_jail === 'manual') return t('firewall.source_manual');
            if (ban.source_jail === 'nftables') return t('firewall.source_nftables');
            if (ban.ban_level >= 5) return t('firewall.source_nftables');
            return ban.source_jail || '--';
        },
        sourceClass(ban) {
            if (ban.source_jail === 'olswpanel') return 'text-blue-400';
            if (ban.source_jail === 'olswpanel-login') return 'text-pink-400';
            if (ban.source_jail === 'olswpanel-sqli') return 'text-red-400';
            if (ban.source_jail === 'olswpanel-404') return 'text-yellow-400';
            if (ban.source_jail === 'olswpanel-sshd') return 'text-green-400';
            if (ban.source_jail === 'manual') return 'text-purple-400';
            if (ban.ban_level >= 4) return 'text-purple-400';
            return 'text-gray-400';
        },
        sourceRuleID(ban) {
            if (ban.source_jail === 'olswpanel') return 'rules-web';
            if (ban.source_jail === 'olswpanel-login') return 'rules-login';
            if (ban.source_jail === 'olswpanel-sqli') return 'rules-sqli';
            if (ban.source_jail === 'olswpanel-404') return 'rules-404';
            if (ban.source_jail === 'olswpanel-sshd') return 'rules-ssh';
            if (ban.source_jail === 'panel_scan') return 'rules-scan';
            if (ban.source_jail === 'panel') return 'rules-panel';
            if (ban.source_jail === 'manual') return 'rules-manual';
            return 'rules-overview';
        },
        openRules(ruleID = 'rules-overview') {
            this.showRules = true;
            this.$nextTick(() => this.focusRule(ruleID));
        },
        focusRule(ruleID) {
            const target = document.getElementById(ruleID || 'rules-overview');
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        },
        formatTime(t) { return t ? new Date(t).toLocaleString(currentLocale()) : '--'; },
        async unban(ban) {
            if (!await confirmModal(t('firewall.confirm_unban', { ip: ban.ip_address }))) return;
            try { await api('/firewall/bans/' + ban.id, { method: 'DELETE' }); await this.fetchBans(); showToast(t('firewall.unbanned'), 'success'); } catch(e) { showToast(e.message, 'error'); }
        },
        async permanentBan(ban) {
            if (!await confirmModal(t('firewall.confirm_permanent_ban', { ip: ban.ip_address }))) return;
            try { await api('/firewall/bans/' + ban.id + '/permanent', { method: 'POST' }); await this.fetchBans(); showToast(t('firewall.added_to_blacklist'), 'success'); } catch(e) { showToast(e.message, 'error'); }
        },
        async copySecurityReport(item) {
            try {
                await navigator.clipboard.writeText(item.copy_text || '');
                showToast(t('firewall.report_copied'), 'success');
            } catch(e) { showToast(t('firewall.copy_failed_manual'), 'error'); }
        },
        async copyFileSecurityEvent(event) {
            const lines = [
                t('firewall.copy_line_type') + this.fileEventTypeLabel(event),
                t('firewall.copy_line_site') + (event.domain || '--'),
                t('firewall.copy_line_risk') + this.riskLabel(event.risk_level),
                t('firewall.copy_line_path') + (event.path || '--'),
                t('firewall.copy_line_source') + this.fileEventSourceLabel(event),
                t('firewall.copy_line_ip') + (event.ip_address || '--'),
                t('firewall.copy_line_count') + this.fileEventCountLabel(event),
                t('firewall.copy_line_last_seen') + (event.last_seen || '--'),
                t('firewall.copy_line_status') + (event.resolved_at ? t('firewall.status_handled') : t('firewall.status_current_risk')),
                t('firewall.copy_line_note') + (event.message || '')
            ];
            try {
                await navigator.clipboard.writeText(lines.join('\n'));
                showToast(t('firewall.file_event_copied'), 'success');
            } catch(e) { showToast(t('firewall.copy_failed_manual'), 'error'); }
        },
        fillBanIP(ip) {
            this.banIP = ip;
            this.activeTab = 'current';
            this.$nextTick(() => {
                this.$refs.banIPInput?.focus();
                this.$refs.banIPInput?.scrollIntoView({ behavior: 'smooth', block: 'center' });
            });
            showToast(t('firewall.ip_filled_notice'), 'success');
        },
        async manualBan() {
            if (!this.banIP.trim()) { showToast(t('firewall.enter_ip'), 'error'); return; }
            this.banSubmitting = true;
            try {
                const r = await api('/firewall/bans', { method: 'POST', body: { ip: this.banIP.trim(), duration: parseInt(this.banDuration) } });
                showToast(r.data?.message || t('firewall.ban_success'), 'success');
                this.banIP = '';
                await this.fetchBans();
            } catch(e) { showToast(e.message, 'error'); }
            finally { this.banSubmitting = false; }
        }
    }
}

</script>
