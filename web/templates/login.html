<!DOCTYPE html>
<html lang="{{.Lang}}" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <meta name="theme-color" content="#11243a">
    <title>{{t .Lang "auth.login"}} - {{.PanelTitle}}</title>
    <link rel="icon" type="image/png" href="{{.AssetPrefix}}/logo.png">
    <link rel="stylesheet" href="{{.AssetPrefix}}/css/main.css?v={{.AssetVersion}}">
    <link rel="stylesheet" href="{{.AssetPrefix}}/css/palette.css?v={{.AssetVersion}}">
    <link rel="stylesheet" href="{{.AssetPrefix}}/css/theme.css?v={{.AssetVersion}}">
    <link rel="stylesheet" href="{{.AssetPrefix}}/css/login.css?v={{.AssetVersion}}">
    <script defer src="{{.AssetPrefix}}/js/alpine.min.js?v={{.AssetVersion}}"></script>
    <script>
        window.OLS_WPANEL_I18N = { lang: "{{.Lang}}", messages: {{.MessagesJSON}} };
    </script>
    <script src="{{.AssetPrefix}}/js/app.js?v={{.AssetVersion}}"></script>
</head>
<body class="login-page" data-panel-prefix="/{{.RandomSuffix}}" data-lang="{{.Lang}}">
    <a class="login-skip" href="#login-main">{{t .Lang "nav.skip_content"}}</a>
    <div class="login-layout" x-data="loginForm()">
        <nav class="login-language" aria-label="{{t .Lang "language.label"}}">
            <a href="?lang=zh-CN" lang="zh-CN" {{if eq .Lang "zh-CN"}}aria-current="true"{{end}}>{{t .Lang "language.chinese"}}</a>
            <a href="?lang=en-US" lang="en-US" {{if eq .Lang "en-US"}}aria-current="true"{{end}}>{{t .Lang "language.english"}}</a>
        </nav>
        <div class="login-stage">
        <main id="login-main" class="login-main" tabindex="-1">
            <div class="login-form-shell">
                <div class="login-brand-identity">
                    <img src="{{.AssetPrefix}}/logo.png" alt="" width="48" height="48">
                    <span>{{.PanelTitle}}</span>
                </div>
                <header class="login-form-heading">
                    <h2 x-text="mfaRequired ? t('auth.mfa_title') : t('auth.workspace_login')">{{t .Lang "auth.workspace_login"}}</h2>
                    <p x-text="mfaRequired ? t('auth.mfa_prompt') : t('auth.workspace_prompt')">{{t .Lang "auth.workspace_prompt"}}</p>
                </header>
                <div class="login-form-state" :aria-busy="loading">
                    <form method="POST" @submit.prevent="login" x-show="!loading">
                        <div class="login-field" x-show="!mfaRequired">
                            <label for="login-username">{{t .Lang "auth.username"}}</label>
                            <div class="login-input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><input id="login-username" type="text" x-model="username" name="username" class="input-field" placeholder="admin" autocomplete="username" autocapitalize="none" spellcheck="false" :aria-describedby="error ? 'login-error' : null"></div>
                        </div>
                        <div class="login-field" x-show="!mfaRequired">
                            <label for="login-password">{{t .Lang "auth.password"}}</label>
                            <div class="login-input-wrap"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="login-password" type="password" x-model="password" name="password" class="input-field" placeholder="{{t .Lang "auth.password_placeholder"}}" autocomplete="current-password" :aria-describedby="error ? 'login-error' : null"></div>
                        </div>
                        <div class="login-field login-field-mfa" x-show="mfaRequired" x-cloak>
                            <label for="login-code" x-text="recoveryMode ? t('auth.recovery_code') : t('auth.mfa_code')"></label>
                            <input id="login-code" x-ref="codeInput" type="text" x-model="code" name="code" class="input-field" autocomplete="one-time-code" :inputmode="recoveryMode ? 'text' : 'numeric'" :maxlength="recoveryMode ? 64 : 6" autocapitalize="none" spellcheck="false" aria-describedby="login-code-help" :aria-invalid="!!error">
                            <p id="login-code-help" class="login-mfa-help" x-text="recoveryMode ? t('auth.recovery_help') : t('auth.mfa_code_help')"></p>
                            <button type="button" class="login-mfa-link" @click="recoveryMode = !recoveryMode; code = ''; error = ''; focusCode()" x-text="recoveryMode ? t('auth.use_authenticator') : t('auth.use_recovery')"></button>
                        </div>
                        <div id="login-error" x-cloak x-show="error" class="login-error" role="alert" x-text="error"></div>
                        <button type="submit" class="btn-primary login-submit" :disabled="loading" x-text="mfaRequired ? t('auth.verify_login') : t('auth.login')">{{t .Lang "auth.login"}}</button>
                        <button x-show="mfaRequired" x-cloak type="button" class="login-mfa-link login-back" @click="resetMFA()">{{t .Lang "auth.back_credentials"}}</button>
                    </form>
                    <div x-cloak x-show="loading" class="login-feedback" role="status" aria-live="polite">
                        <span class="login-spinner" aria-hidden="true"></span>
                        <p>{{t .Lang "auth.validating"}}</p>
                    </div>
                </div>
                <p class="login-account-note"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>{{t .Lang "auth.admin_account_note"}}</p>
            </div>
        </main>
        </div>
    </div>

    <script>
    function loginForm() {
        return {
            username: '',
            password: '',
            code: '',
            mfaRequired: false,
            recoveryMode: false,
            loading: false,
            error: '',
            focusCode() {
                this.$nextTick(() => requestAnimationFrame(() => {
                    if (this.mfaRequired && !this.loading) this.$refs.codeInput.focus();
                }));
            },
            resetMFA() {
                this.mfaRequired = false;
                this.recoveryMode = false;
                this.code = '';
                this.password = '';
                this.error = '';
                this.$nextTick(() => requestAnimationFrame(() => document.getElementById('login-password').focus()));
            },
            async refreshCSRFToken() {
                const prefix = document.body.dataset.panelPrefix || '';
                const response = await fetch(prefix + '/api/auth/csrf-token', {
                    method: 'GET',
                    credentials: 'same-origin',
                    cache: 'no-store',
                    headers: { 'Accept': 'application/json' }
                });
                const data = await response.json();
                if (!response.ok || !data.success || !data.data?.token) {
                    throw new Error(data.message || t('auth.missing_csrf'));
                }
                document.querySelector('meta[name="csrf-token"]').content = data.data.token;
            },
            async login() {
                if (this.loading) return;
                if (!this.username || !this.password) {
                    this.error = t('auth.missing_credentials');
                    return;
                }
                if (this.mfaRequired && !this.code.trim()) {
                    this.error = t('auth.code_required');
                    this.focusCode();
                    return;
                }
                this.loading = true;
                this.error = '';
                try {
                    let resp;
                    for (let attempt = 0; attempt < 2; attempt++) {
                        await this.refreshCSRFToken();
                        try {
                            resp = await api('/auth/login', {
                                method: 'POST',
                                body: { username: this.username, password: this.password, code: this.code.trim() },
                                silent: true
                            });
                            break;
                        } catch (e) {
                            if (e.status !== 403 || attempt > 0) throw e;
                        }
                    }
                    if (resp.success && resp.data?.mfa_required) {
                        this.mfaRequired = true;
                        this.code = '';
                        this.loading = false;
                        this.focusCode();
                    } else if (resp.success) {
                        this.password = '';
                        this.code = '';
                        window.location.href = '/' + document.body.dataset.panelPrefix.replace('/', '') + '/';
                    } else {
                        this.error = resp.message || t('auth.login_failed');
                        this.loading = false;
                    }
                } catch (e) {
                    this.error = e.message || t('auth.connect_failed');
                    this.loading = false;
                }
            }
        }
    }
    </script>
</body>
</html>
